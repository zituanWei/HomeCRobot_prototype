# 家庭陪护机器人 HomeCRobot — 项目文档内容
# 格式：YAML 风格，供 gen_doc.py 读取
# 这样正文数据与代码分开，改内容不需要碰 Python

title: 家庭陪护机器人 HomeCRobot
subtitle: 项目技术文档

overview:
  - 段落: 面向家庭陪护场景的桌面机器人系统。在普通电脑上运行，通过摄像头感知环境与用户状态，通过麦克风与扬声器进行语音交互，以本地大模型完成理解与回应。
  - 段落: 系统不依赖云端，隐私数据不出本机。视觉模型、语音识别、语音合成都可在本地完成。
  - 目标:
    - 能看：识别画面中是否有人、是谁，理解用户外貌动作与场景
    - 能听：接收用户语音，自动断句并转写为文字
    - 能说：把回复合成为语音播报，支持随时打断
    - 主动关心：无人时安静，有人出现时主动打招呼，异常时提醒
    - 离线可用：模型与语音合成均可在本地完成

status:
  headers: [能力板块, 状态, 说明]
  rows:
    - [视觉对话, 已完成, 拍照加图文推理，按需触发而非每句都拍]
    - [人脸识别, 已完成, 注册识别与多照片管理，支持引导注册]
    - [语音输入, 已完成, 麦克风常开加端点检测加语音识别]
    - [语音输出, 已完成, 多引擎可切换，支持后台播放与打断]
    - [主动关怀, 已完成, 在场感知主动打招呼久坐与异常提醒]
    - [本地化部署, 已完成, 四比特量化适配八G显存，全链路离线可行]
    - [唤醒词, 未实现, 当前为麦克风常开模式]
    - [情绪识别, 未实现, 规划中]

architecture_flow: |
  键盘输入线程  ─┐
  语音识别线程  ─┼─→  事件队列  ─→  主循环分发  ─→  对话工作线程  ─→  文字 + 语音
  视觉监控线程  ─┘

architecture_note: 这样设计的原因是语音键盘与后台监控可以同时存在，且机器人在播报时依然能响应新的输入。

core_modules:
  headers: [模块, 职责]
  rows:
    - [audio.py, 音频地基：播放器录音机环形缓冲语音端点检测]
    - [camera.py, 摄像头采集拍照存储与容量控制]
    - [vl_model.py, 视觉语言模型加载与推理，含并发锁]
    - [face_recognition.py, 人脸检测识别多照片注册与管理]
    - [monitor.py, 后台监控：在场感知身份识别主动关怀]
    - [vision_trigger.py, 判断这句话是否需要看画面]
    - [intent_recognizer.py, 自然语言意图识别]
    - [guided_enroll.py, 认不出人时的引导注册状态机]
    - [conversation.py, 对话历史管理与持久化]

ext_modules:
  headers: [模块, 职责]
  rows:
    - [asr.py, 语音识别，含无效语音过滤与实时链路组装]
    - [tts.py, 语音合成，支持三种引擎与自动降级]

utils_modules:
  headers: [模块, 职责]
  rows:
    - [helpers.py, 终端输出美化显存查询优雅退出]
    - [utterance_filter.py, 输入过滤：重复句去重语气词过滤]
    - [phrases.py, 固定语音文案集中管理，供预合成加速]

concurrency:
  headers: [共享资源, 风险, 保护方式]
  rows:
    - [视觉模型, 监控与对话线程同时推理会导致输出错乱, 推理锁串行化加忙碌标志避让]
    - [对话历史, 多线程读写, 互斥锁保护]
    - [摄像头, 两个线程同时读取设备, 硬件访问加锁]
    - [麦克风, 播报时被自己识别, 播报期间静音麦克风]
    - [音频播放, 无法等待或打断, 独立播放线程加块间可中断]

func_vision: 系统并非每句话都调用模型。用关键词判断是否需要看画面，纯闲聊与知识类问题不拍照，节省算力。
func_vision_warn: 触发判断基于关键词表而非语义理解。遇到词表未覆盖的新说法可能漏拍，显式加一句「你看」必定触发。

face_tree: |
  data/faces/
  ├── 张三/
  │   ├── 1.jpg          注册原图，可人工查看或删除
  │   ├── 2.jpg
  │   └── 3.jpg
  └── 李四/
      └── 1.jpg
  data/face_database.json    特征索引，与目录一一对应

face_points:
  - 一人多照片：同一人可注册多张，识别时取该人所有特征的最高分而非平均值。只要有一张角度匹配就能认出，不会被拍歪的照片拉低判断
  - 注册质量门槛：注册前检查人脸数量面积占比检测置信度图像清晰度，不合格会明确告知原因，避免存进无效特征
  - 原图保留：注册照片永久保留，便于事后核查与换模型重提特征

asr_chain: |
  麦克风常开采集
    → 能量端点检测，判断是否说完一句
    → 无效语音过滤：时长周期性噪声占比
    → 语音识别转写为文字
    → 文本过滤：语气词重复句
    → 进入对话流程

asr_note: 麦克风设备编号与环境相关。换耳机或换电脑后需要重新校准，运行 calibrate_mic 脚本可自动找出可用设备。

tts_engines:
  headers: [引擎, 归属, 延迟, 音质, 需要联网]
  rows:
    - [edge-tts, 微软在线朗读服务, 1.6到13.9秒波动, 最自然, 是]
    - [piper, 开源本地神经语音, 约0.23秒, 中上, 否]
    - [sapi, 微软Windows语音, 约0.5秒, 机械, 否]

tts_fallback:
  - 阶段一：流式播放，边合成边播，最快但依赖服务端返回速度
  - 阶段二：整句合成，等待完整音频
  - 阶段三：切换到本地引擎，保证一定出声

tts_preload: 启动后在后台把高频固定语句提前合成并缓存，命中缓存时零延迟。文案集中维护在 utils/phrases.py。

monitor_levels:
  headers: [层级, 间隔, 内容, 开销]
  rows:
    - [在场检测, 1.5秒, 人脸检测：有没有人是谁, 毫秒级不占显存]
    - [深度分析, 60秒, 视觉理解：在做什么有无异常, 数秒占用显存]

monitor_actions:
  - 主动打招呼：检测到从没人到有人的状态跳变时识别身份并问候，同一人有冷却时间避免反复打扰
  - 久坐提醒：长时间画面无明显变化时提醒活动
  - 异常关怀：判断可能存在摔倒不适等情况时主动询问
  - 长时间无人：连续多次没检测到人时询问近况

enroll_flow: |
  系统：我好像还不太认识你，能告诉我你叫什么名字吗？
  用户：我叫张三
  系统：好的，你叫「张三」，是这个吗？        ← 复述确认
  用户：对
  系统：拍照并质量检查，记住了你是张三

enroll_warn: 采用两步确认而非听到名字就存。原因有二：一是语音识别名字常出错，直接保存会写入错名字；二是不确认的话，任何人都能对着摄像头冒充家人。

tech_choices:
  headers: [环节, 选型, 理由]
  rows:
    - [视觉理解, Qwen2.5-VL-3B-Instruct, 中文支持好，量化后可在8G显存运行]
    - [人脸检测, OpenCV YuNet, OpenCV内置无需额外依赖，速度毫秒级]
    - [人脸识别, OpenCV SFace, 同上，128维特征适合小规模家庭成员]
    - [语音识别, FunASR paraformer-zh, 中文识别效果好，本地离线运行]
    - [语音合成, edge-tts 与 Piper 与 SAPI, 多引擎可切换，兼顾音质与稳定性]
    - [音频输入输出, sounddevice, 跨平台，Windows有预编译包无需编译]
    - [量化方案, bitsandbytes, 让大模型能在消费级显卡运行]

measured_audio:
  headers: [项目, 实测结果]
  rows:
    - [语音识别模型加载, 17到43秒，首次需下载模型]
    - [单句识别耗时, 约2秒，取决于音频长度]
    - [edge-tts 合成, 1.6到13.9秒，随网络波动]
    - [Piper 合成, 0.23秒，CPU推理]
    - [预合成缓存命中, 从12.73秒降到0.000秒]
    - [麦克风采集, 正确设备下峰值均方根0.01到0.08]

measured_vision:
  headers: [任务类型, 结果, 说明]
  rows:
    - [大号字符识别, 正确, 清晰大字可靠]
    - [小号字符识别, 正确, 二十像素小字也能读对]
    - [颜色识别, 正确, 基本颜色可靠]
    - [空间关系, 正确, 左右方位判断可靠]
    - [计数, 正确, 少量物体计数可靠]
    - [小物体检测, 失败, 约三十像素的小图形被漏检，答为空白图片]
    - [细粒度形状, 失败, 正方形与长方形会混淆]
    - [多物体命名, 失败, 能描述形状颜色但说不出物体名称]

measured_stability:
  headers: [配置, 结果]
  rows:
    - [8bit 加温度0.7, 五次提问得到五个不同答案，一次出现无法看到图片]
    - [4bit 加温度0.7, 同样五次五个答案，稳定性无改善]
    - [8bit 加温度0, 输出固定为一种答案，但稳定地拒答]

stability_warn: 输出随机性主要来自采样温度偏高。四比特与八比特稳定性相当，但四比特更省显存。拒答类幻觉属于模型固有缺陷，调整温度无法根治。

measured_scene:
  headers: [场景, 命中率, 稳定性]
  rows:
    - [空房间是否有人, 三分之二, 较稳]
    - [有人坐着, 三次全中, 三次三个不同答案]
    - [有人躺在地上, 三分之一, 三次三个不同答案]
    - [有人站立, 三分之一, 三次三个不同答案]

scene_warn: 姿态判断可靠度偏低。因此异常检测不能依赖单次判断，建议多次确认后再提醒。

dir_tree: |
  HomeCRobot/
  ├── main.py                    主程序，事件驱动主循环
  ├── config.py                  全局配置，所有可调参数集中于此
  ├── check_env.py               环境自检
  ├── core/                      核心模块
  │   ├── audio.py               音频输入输出地基
  │   ├── camera.py              摄像头采集与拍照管理
  │   ├── vl_model.py            视觉语言模型封装
  │   ├── face_recognition.py    人脸识别与多照片管理
  │   ├── monitor.py             后台监控与主动关怀
  │   ├── vision_trigger.py      视觉触发判断
  │   ├── intent_recognizer.py   意图识别
  │   ├── guided_enroll.py       引导注册状态机
  │   └── conversation.py        对话历史
  ├── modules/                   扩展模块
  │   ├── asr.py                 语音识别
  │   └── tts.py                 语音合成
  ├── utils/                     工具
  │   ├── helpers.py
  │   ├── utterance_filter.py    输入过滤
  │   └── phrases.py             固定文案
  ├── scripts/                   工具与自检脚本
  ├── data/                      运行时数据
  │   ├── faces/                 人脸注册原图，按人分目录
  │   ├── photos/                普通拍照，有容量上限
  │   └── conversation_history.json
  └── models/                    模型文件

scripts_table:
  headers: [脚本, 用途]
  rows:
    - [check_env.py, 环境自检：Python显卡依赖摄像头音频设备]
    - [download_model.py, 下载三B视觉模型]
    - [download_model_7b.py, 下载七B视觉模型]
    - [download_piper.py, 下载本地语音合成模型]
    - [calibrate_mic.py, 麦克风校准与设备扫描]
    - [diagnose_asr.py, 语音识别诊断，区分信号问题与模型问题]
    - [diagnose_vad.py, 断句诊断，看一句话被切成几段]
    - [test_audio_loop.py, 音频链路自检]
    - [test_integration.py, 集成自检，不加载大模型]
    - [test_main_smoke.py, 主程序启动冒烟测试]
    - [test_guided_enroll.py, 引导注册状态机测试]
    - [test_tts_latency.py, 语音合成延迟对比]
    - [test_quant_stability.py, 量化与温度稳定性对比]
    - [test_vision_ability.py, 视觉能力实测]
    - [test_vision_scene.py, 陪护场景视觉测试]
    - [generate_dataset.py, 微调数据集生成]

deploy_cmd: |
  # 1. 环境检查
  python check_env.py

  # 2. 麦克风校准，首次必做
  python scripts/calibrate_mic.py --scan

  # 3. 启动，开启语音
  python main.py --voice

commands:
  headers: [命令, 作用]
  rows:
    - [/register 姓名, 注册人脸，可重复执行，每人最多8张]
    - [/faces, 查看人脸库及每人照片数]
    - [/photos 姓名, 查看某人的照片清单]
    - [/forget 姓名, 删除该人全部记录]
    - [/forget 姓名 2, 只删第2张]
    - [/clearfaces, 清空整个人脸库]
    - [/look 问题, 拍照并结合画面回答]
    - [/voice on 或 off 或 stop, 语音回复开关与停止播报]
    - [/listen, 查看语音链路状态]
    - [/audio, 列出音频设备]
    - [/monitor, 查看监控状态与统计]
    - [/gpu, 查看显存占用]

nl_examples: 除命令外也支持自然语言，例如：记住我的脸 / 你都认识谁 / 我是谁 / 把所有人删除 / 再见。

limit_model:
  - 小物体漏检：画面中占比很小的物体可能完全看不到
  - 细粒度识别弱：能描述形状颜色，但难以准确说出物体名称
  - 姿态判断不稳：站立坐着躺下会互相混淆，不适合作为唯一判据
  - 拒答型幻觉：偶发回答无法看到图片，即使图像正常
  - 输出随机：采样温度较高时，同一输入会得到不同答案

limit_arch:
  - 无唤醒词：麦克风常开，会听到环境中所有人声，他人唱歌或交谈会被当作输入
  - 在线语音合成不可控：延迟随网络波动，且可能因风控返回错误
  - 视觉触发靠关键词：不是语义理解，新说法可能漏拍
  - 语音识别存同音字错误：人名等专有名词尤其容易出错，建议用文字命令注册

config_map:
  headers: [配置类, 管辖范围]
  rows:
    - [VLConfig, 视觉模型路径量化方式生成参数人设提示词]
    - [CameraConfig, 摄像头编号分辨率拍照存储与容量上限]
    - [VoiceConfig, 语音开关设备端点检测参数引擎与音色]
    - [FaceConfig, 人脸识别阈值注册质量门槛引导注册开关]
    - [MonitorConfig, 监控间隔在场检测主动打招呼与冷却时间]
    - [ConversationConfig, 对话历史长度与存储位置]

howto:
  headers: [想做什么, 改哪里]
  rows:
    - [换更聪明的视觉模型, VLConfig 的 MODEL_NAME，注意同步调整量化设置]
    - [让回复更稳定或更有创意, VLConfig 的 TEMPERATURE，低更稳定高更多样]
    - [换语音音色, VoiceConfig 的 TTS_VOICE，或更换本地引擎音色]
    - [语音总是不出声, VoiceConfig 的 MIC_DEVICE，并运行麦克风校准脚本]
    - [识别不出人, FaceConfig 的 THRESHOLD 调低，并多注册几张照片]
    - [打招呼太频繁, MonitorConfig 的冷却时间调大]
    - [减少显存占用, 改四比特量化，调大监控间隔]
    - [改机器人性格, VLConfig 的 SYSTEM_PROMPT]
    - [改固定话术, utils/phrases.py]

verify_cmd: |
  python scripts/test_integration.py      秒级，先跑这个
  python scripts/test_main_smoke.py       启动路径
  python scripts/test_audio_loop.py       动了音频才跑
  python scripts/test_guided_enroll.py    动了注册流程才跑

update_doc: 本文档由脚本生成。修改内容后重新运行生成脚本即可更新。

troubleshoot:
  headers: [现象, 先做什么]
  rows:
    - [说了话没反应, 看启动时有无麦克风信号异常警告，运行麦克风校准脚本]
    - [识别结果乱码, 运行断句诊断脚本，看是否被切成多段]
    - [识别不准, 运行识别诊断脚本，听录音判断是信号问题还是模型问题]
    - [人脸认不出, 检查注册照片质量，查看照片清单，调低阈值]
    - [语音不出声, 看合成引擎是否被网络问题阻塞，切换到本地引擎]
    - [启动报显存不足, 改四比特量化，调大监控间隔，关闭其他占显存程序]
