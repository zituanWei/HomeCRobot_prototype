<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小护 · 家庭陪护机器人</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161b22; --panel2:#1c2430; --line:#2a3441;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922; --danger:#f85149; --bot:#1f6feb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
       background:var(--bg);color:var(--fg);height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:390px 1fr;height:100vh}
  @media(max-width:960px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

  /* ---------- 左侧 ---------- */
  /* 布局要点：
     .side 固定高度、不滚动；.brand 固定；.cards 独立滚动。
     之前直接给 .side 设 overflow-y:auto 是无效的——flex 子项默认
     flex-shrink:1，会被压扁而不是撑出滚动条，所以内容显示不全。 */
  .side{background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .brand{padding:14px 16px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:11px;flex-shrink:0}
  .cards{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:14px;
         scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-track{background:transparent}
  .cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .cards::-webkit-scrollbar-thumb:hover{background:#3a4756}

  /* 卡片折叠 */
  .card-head{display:flex;align-items:center;gap:6px;cursor:pointer;
             user-select:none;transition:.15s}
  .card-head:hover{color:var(--fg)}
  .card-head .title{flex:1;min-width:0}
  .card-head .chev{font-size:9px;color:var(--dim);transition:transform .2s;
                   flex-shrink:0;line-height:1}
  .card.collapsed .card-head .chev{transform:rotate(-90deg)}
  .card.collapsed .body{display:none}
  .card.collapsed{opacity:.85}
  .bot-avatar{width:42px;height:42px;border-radius:11px;flex-shrink:0;
              background:var(--bot);display:flex;align-items:center;
              justify-content:center;font-size:23px;overflow:hidden;
              cursor:pointer;position:relative;transition:.15s}
  .bot-avatar:hover{outline:2px solid var(--accent2)}
  .bot-avatar img{width:100%;height:100%;object-fit:cover}
  .bot-avatar::after{content:"改";position:absolute;bottom:-1px;right:-1px;
    font-size:9px;background:var(--accent2);color:#fff;border-radius:4px;
    padding:0 3px;opacity:0;transition:.15s}
  .bot-avatar:hover::after{opacity:1}
  .brand .txt h1{font-size:16px;font-weight:600}
  .brand .txt .st{font-size:11.5px;color:var(--dim);display:flex;
                  align-items:center;gap:5px;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--accent);box-shadow:0 0 7px var(--accent)}

  .card{margin:11px 13px;background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;overflow:hidden}
  .card h2{font-size:11.5px;font-weight:600;color:var(--dim);padding:9px 13px;
           border-bottom:1px solid var(--line);letter-spacing:.4px;
           display:flex;justify-content:space-between;align-items:center}
  .card .body{padding:11px 13px;font-size:13px}
  .card h2 button{padding:2px 8px;font-size:11px}

  .video-wrap{background:#000;aspect-ratio:4/3;display:flex;
              align-items:center;justify-content:center;position:relative}
  .video-wrap img{width:100%;height:100%;object-fit:contain;display:block}
  .video-wrap .off{color:var(--dim);font-size:12.5px;text-align:center;padding:0 16px}

  .kv{display:flex;justify-content:space-between;padding:4px 0;
      border-bottom:1px dashed rgba(255,255,255,.06);font-size:12px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--dim)} .kv .v{font-weight:500}
  .v.ok{color:var(--accent)} .v.no{color:var(--danger)} .v.warn{color:var(--warn)}

  .person{display:flex;align-items:center;justify-content:space-between;
          padding:7px 9px;border:1px solid var(--line);border-radius:8px;
          margin-bottom:6px;background:rgba(255,255,255,.02)}
  .person .nm{font-size:13px;font-weight:500}
  .person .cnt{font-size:11px;color:var(--dim);margin-left:6px}
  .person .acts{display:flex;gap:5px}
  .person .acts button{padding:3px 8px;font-size:11px}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:8px 0}

  .row{display:flex;gap:7px}
  input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);
    color:var(--fg);border-radius:7px;padding:8px 11px;font-size:13px;
    font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--bot)}

  .btns{display:flex;gap:7px;flex-wrap:wrap}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    padding:8px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;
    font-family:inherit;transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--accent2);color:var(--accent2)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--bot);border-color:var(--bot);color:#fff}
  button.primary:hover{background:#388bfd;color:#fff}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  button.mini{padding:3px 7px;font-size:11px}

  /* ---------- 右侧 ---------- */
  .main{display:flex;flex-direction:column;height:100vh;min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;
        flex-direction:column;gap:13px}
  .msg{display:flex;gap:9px;max-width:84%;animation:fade .22s}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:33px;height:33px;border-radius:9px;flex-shrink:0;
          display:flex;align-items:center;justify-content:center;
          font-size:16px;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .msg.bot .avatar{background:var(--bot)}
  .msg.user .avatar{background:#30363d}
  .bubble{background:var(--panel2);border:1px solid var(--line);
          border-radius:12px;padding:10px 14px;font-size:14.5px;
          line-height:1.68;word-break:break-word;white-space:pre-wrap}
  .msg.user .bubble{background:var(--bot);border-color:var(--bot);color:#fff}
  .msg.sys .bubble{background:transparent;border:1px dashed var(--line);
                   color:var(--dim);font-size:12.5px;padding:6px 12px}
  .msg.sys{align-self:center;max-width:92%}
  .meta{font-size:11px;color:var(--dim);margin-top:5px}

  .typing{display:flex;gap:4px;padding:3px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--dim);
               animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--accent2);
          vertical-align:-2px;margin-left:2px;animation:blink .9s infinite}

  .composer{border-top:1px solid var(--line);padding:12px 18px;background:var(--panel)}
  textarea{flex:1;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:10px;padding:10px 13px;font-size:14.5px;
    resize:none;font-family:inherit;line-height:1.5;max-height:130px;min-height:44px}
  textarea:focus{outline:none;border-color:var(--bot)}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;display:flex;
        justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .rec{background:var(--danger)!important;border-color:var(--danger)!important;
       color:#fff!important;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .sw{display:flex;align-items:center;gap:5px;cursor:pointer}
  .sw input{accent-color:var(--accent)}

  /* 音频解锁提示 */
  .unlock{position:fixed;left:50%;top:14px;transform:translateX(-50%);
    background:var(--warn);color:#000;padding:8px 18px;border-radius:20px;
    font-size:12.5px;font-weight:600;z-index:99;display:none;
    box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer}
  .unlock.show{display:block;animation:fade .3s}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--line);padding:9px 18px;
    border-radius:9px;font-size:12.5px;z-index:99;display:none;
    box-shadow:0 4px 16px rgba(0,0,0,.5);max-width:80%}
  .toast.show{display:block;animation:fade .2s}
  .toast.err{border-color:var(--danger);color:#ffb3ae}

  /* 服务端彻底连不上时的遮罩提示 */
  .offline{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(248,81,73,.96);color:#fff;padding:18px 28px;
    border-radius:12px;font-size:14px;font-weight:600;text-align:center;
    z-index:200;line-height:1.8;box-shadow:0 8px 30px rgba(0,0,0,.6)}
  .offline code{background:rgba(0,0,0,.3);padding:1px 7px;border-radius:4px;
    font-family:Consolas,monospace;font-weight:400}
</style>
</head>
<body>

<div class="unlock" id="unlock">🔊 点这里开启语音播报</div>
<div class="toast" id="toast"></div>

<div class="app">
  <!-- ============ 左侧 ============ -->
  <aside class="side">
    <div class="brand">
      <div class="bot-avatar" id="botAvatar" title="点击更换头像">🐋</div>
      <div class="txt">
        <h1>小护</h1>
        <div class="st"><span class="dot" id="dot"></span><span id="stText">未启动</span></div>
      </div>
    </div>
    <input type="file" id="avatarFile" accept="image/*" style="display:none">

    <!-- 卡片区：独立滚动，品牌栏固定在上方 -->
    <div class="cards">

    <div class="card" data-card="摄像头">
      <h2 class="card-head"><span class="title">摄像头</span><span class="chev">▾</span></h2>
      <div class="video-wrap">
        <img id="video" alt="" style="display:none">
        <div class="off" id="videoOff">等待系统启动…</div>
      </div>
    </div>
    <div class="card" data-card="快捷操作">
      <h2 class="card-head"><span class="title">快捷操作</span><span class="chev">▾</span></h2>
      <div class="body">
        <div class="btns">
          <button class="primary" id="btnLoad">启动系统</button>
          <button id="btnRecognize">我是谁</button>
          <button id="btnClearChat" class="danger">清空对话</button>
        </div>
        <div class="btns" style="margin-top:7px">
          <button id="btnUnload" title="释放摄像头与显存，网页继续保留">释放摄像头/显存</button>
          <button id="btnShutdown" class="danger" title="关闭服务并释放全部资源">关闭服务</button>
        </div>
        <div class="meta" id="statsLine" style="margin-top:9px"></div>
      </div>
    </div>
    <div class="card" data-card="系统状态">
      <h2 class="card-head"><span class="title">系统状态</span><button class="mini" id="btnRefresh">刷新</button><span class="chev">▾</span></h2>
      <div class="body">
        <div class="kv"><span class="k">模型</span><span class="v warn" id="sReady">未启动</span></div>
        <div class="kv"><span class="k">摄像头</span><span class="v" id="sCam">—</span></div>
        <div class="kv"><span class="k">语音识别</span><span class="v" id="sAsr">—</span></div>
        <div class="kv"><span class="k">语音合成</span><span class="v" id="sTts">—</span></div>
        <div class="kv"><span class="k">语音播报</span><span class="v" id="sVoice">—</span></div>
      </div>
    </div>
    <div class="card" data-card="人脸库">
      <h2 class="card-head"><span class="title">人脸库</span><button class="mini danger" id="btnClearFaces">清空</button><span class="chev">▾</span></h2>
      <div class="body">
        <div id="people"><div class="empty">尚无注册</div></div>
        <div class="row" style="margin-top:9px">
          <input type="text" id="newName" placeholder="输入名字后点注册">
          <button class="primary" id="btnRegister">拍照注册</button>
        </div>
        <div class="empty" style="text-align:left;padding-top:7px">
          正对摄像头、脸占画面大一些，可重复注册多张提高准确率
        </div>
      </div>
    </div>
    <div class="card" id="monitorCard" style="display:none" data-card="后台监控">
      <h2 class="card-head"><span class="title">后台监控</span><span class="chev">▾</span></h2>
      <div class="body" id="monitorBox"></div>
    </div>
    </div><!-- /.cards -->
  </aside>

  <!-- ============ 右侧 ============ -->
  <main class="main">
    <div class="msgs" id="msgs">
      <div class="msg sys"><div class="bubble">
        点左侧「启动系统」加载模型。加载完成后可直接对话——<br>
        画面检测和语音播报都会自动进行。
      </div>
    </div>
    </div>

    <div class="composer">
      <div class="row">
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="primary" id="btnSend">发送</button>
        <button id="btnMic" title="点击开始持续监听；之后一直录音，说话停顿约1秒自动发送。再点一次停止。">🎤</button>
      </div>
      <div class="hint">
        <span>
          <label class="sw" title="不勾选时系统会自动判断要不要看画面">
            <input type="checkbox" id="chkVision"> 强制看画面
          </label>
          <span style="margin-left:10px;color:#6b7684">
            （不勾选＝自动判断）
          </span>
        </span>
        <span id="tip">就绪</span>
      </div>
    </div>
  </main>
</div><!-- /.app -->

<script>
(() => {
  const $ = id => document.getElementById(id);
  const msgs = $('msgs');
  let AVATAR_HTML = '🐋';        // 机器人头像的 HTML（emoji 或 <img>）
  let TYPE_INTERVAL = 18;        // 打字机间隔 ms

  // ================= UI 基础 =================
  function scroll(){ msgs.scrollTop = msgs.scrollHeight; }

  function makeAvatar(role){
    const av = document.createElement('div');
    av.className = 'avatar';
    if(role === 'user'){ av.textContent = '我'; }
    else if(role === 'bot'){ av.innerHTML = AVATAR_HTML; }
    else { av.textContent = '·'; }
    return av;
  }

  function add(role, text, meta){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.appendChild(makeAvatar(role));
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;
    if(meta){
      const m = document.createElement('div');
      m.className = 'meta'; m.textContent = meta;
      bub.appendChild(m);
    }
    wrap.appendChild(bub);
    msgs.appendChild(wrap); scroll();
    return bub;
  }

  // 打字机效果：先建气泡，再逐字填充
  function addTyping(role){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.appendChild(makeAvatar(role));
    const bub = document.createElement('div');
    bub.className = 'bubble';
    wrap.appendChild(bub);
    msgs.appendChild(wrap); scroll();
    return bub;
  }

  function typewrite(bubble, text, meta){
    return new Promise(res => {
      let i = 0;
      const cur = document.createElement('span');
      cur.className = 'cursor';
      bubble.textContent = '';
      bubble.appendChild(cur);
      const step = () => {
        if(i >= text.length){
          cur.remove();
          bubble.textContent = text;
          if(meta){
            const m = document.createElement('div');
            m.className = 'meta'; m.textContent = meta;
            bubble.appendChild(m);
          }
          scroll(); res(); return;
        }
        // 一次补几个字，长文本不至于太慢
        const n = Math.max(1, Math.round(text.length / 220));
        cur.insertAdjacentText('beforebegin', text.slice(i, i + n));
        i += n;
        scroll();
        setTimeout(step, TYPE_INTERVAL);
      };
      step();
    });
  }

  function thinking(){
    const w = document.createElement('div');
    w.className = 'msg bot'; w.id = 'thinking';
    w.innerHTML = '<div class="avatar">' + AVATAR_HTML + '</div>' +
      '<div class="bubble"><div class="typing"><span></span><span></span>' +
      '<span></span></div></div>';
    msgs.appendChild(w); scroll();
  }
  function stopThinking(){ const t = $('thinking'); if(t) t.remove(); }

  function tip(t){ $('tip').textContent = t; }

  let toastTimer = null;
  function toast(text, isErr){
    const el = $('toast');
    el.textContent = text;
    el.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = 'toast', 3200);
  }

  function setV(id, text, cls){
    const el = $(id); if(!el) return;
    el.textContent = text;
    el.className = 'v' + (cls ? ' ' + cls : '');
  }

  // ================= 状态渲染 =================
  function renderStatus(s){
    $('dot').className = 'dot' + (s.ready ? ' on' : '');
    const stTxt = s.loading ? '加载中…' : (s.error ? '异常' : (s.ready ? '已就绪' : '未启动'));
    $('stText').textContent = stTxt;
    if(s.loading)    setV('sReady','加载中…','warn');
    else if(s.error) setV('sReady','异常','no');
    else if(s.ready) setV('sReady','就绪','ok');
    else             setV('sReady','未启动','warn');

    setV('sCam', s.camera ? '可用' : '不可用', s.camera ? 'ok' : 'no');
    setV('sAsr', s.asr_ready ? '已就绪' : (s.ready ? '加载中' : '—'),
         s.asr_ready ? 'ok' : 'warn');
    setV('sTts', s.tts_engine || '—');
    setV('sVoice', s.voice_on ? '开启' : '关闭', s.voice_on ? 'ok' : 'warn');

    // 头像
    if(s.avatar){
      if(s.avatar.custom && s.avatar.url){
        AVATAR_HTML = '<img src="' + s.avatar.url + '" alt="">';
      } else {
        AVATAR_HTML = s.avatar.emoji || '🐋';
      }
      $('botAvatar').innerHTML = AVATAR_HTML;
    }
    if(typeof s.typewriter_interval === 'number'){
      TYPE_INTERVAL = s.typewriter_interval;
    }

    // 人脸库
    renderPeople(s.people || (s.faces || []).map(n => ({name:n, count:0})));

    // 监控
    if(s.monitor){
      $('monitorCard').style.display = '';
      const mb = $('monitorBox'); mb.innerHTML = '';
      Object.entries(s.monitor).forEach(([k,v]) => {
        const d = document.createElement('div');
        d.className = 'kv';
        d.innerHTML = '<span class="k"></span><span class="v"></span>';
        d.children[0].textContent = k;
        d.children[1].textContent = v;
        mb.appendChild(d);
      });
    }

    if(s.stats){
      $('statsLine').textContent =
        `对话 ${s.stats['对话轮数']||0} 轮 · 播报 ${s.stats['语音播报']||0} 次 · ` +
        `主动 ${s.stats['主动消息']||0} 次`;
    }

    // 视频
    const img = $('video'), off = $('videoOff');
    if(s.camera){
      if(!img.src) img.src = '/video?' + Date.now();
      img.style.display = ''; off.style.display = 'none';
    } else {
      img.style.display = 'none'; off.style.display = '';
      off.textContent = s.ready ? '摄像头不可用' : '等待系统启动…';
    }
  }

  function renderPeople(people){
    const box = $('people');
    box.innerHTML = '';
    if(!people || !people.length){
      box.innerHTML = '<div class="empty">尚无注册</div>';
      return;
    }
    people.forEach(p => {
      const d = document.createElement('div');
      d.className = 'person';
      const left = document.createElement('div');
      left.innerHTML = '<span class="nm"></span><span class="cnt"></span>';
      left.querySelector('.nm').textContent = p.name;
      left.querySelector('.cnt').textContent = p.count ? p.count + ' 张' : '';
      const acts = document.createElement('div');
      acts.className = 'acts';

      const bAdd = document.createElement('button');
      bAdd.className = 'mini'; bAdd.textContent = '＋';
      bAdd.title = '再拍一张（提高识别率）';
      bAdd.onclick = () => doRegister(p.name);
      acts.appendChild(bAdd);

      // 有多张时才显示"删一张"
      if(p.count > 1){
        const bDel1 = document.createElement('button');
        bDel1.className = 'mini'; bDel1.textContent = '－';
        bDel1.title = '删除其中一张';
        bDel1.onclick = () => {
          const idx = prompt(`删除「${p.name}」的第几张？（1 ~ ${p.count}）`, p.count);
          if(!idx) return;
          const n = parseInt(idx, 10);
          if(!n || n < 1 || n > p.count){ toast('序号无效', true); return; }
          send({type:'face_delete', name:p.name, index:n});
        };
        acts.appendChild(bDel1);
      }

      const bDel = document.createElement('button');
      bDel.className = 'mini danger'; bDel.textContent = '×';
      bDel.title = '删除这个人（含全部照片）';
      bDel.onclick = () => doDeletePerson(p.name);
      acts.appendChild(bDel);

      d.appendChild(left); d.appendChild(acts);
      box.appendChild(d);
    });
  }

  // ================= WebSocket =================
  let ws = null, wsReady = false, audioUnlocked = false;
  let lastReplyBubble = null;
  let pendingRequest = false;     // 是否有消息发出去还没收到回复
  let reconnectFails = 0;

  // 服务彻底连不上时给出明确提示（而不是无声重试）
  function showOffline(){
    let el = $('offline');
    if(!el){
      el = document.createElement('div');
      el.id = 'offline';
      el.className = 'offline';
      el.innerHTML = '🔌 无法连接服务端 —— 可能已停止运行<br>' +
        '<span style="font-size:11.5px;font-weight:400">' +
        '请在项目目录重新运行：<code>python web_server.py</code></span>';
      document.body.appendChild(el);
    }
  }
  function hideOffline(){
    const el = $('offline');
    if(el) el.remove();
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      wsReady = true;
      reconnectFails = 0;
      hideOffline();
      tip('已连接');
      send({type:'status'});
    };
    ws.onclose = () => {
      wsReady = false;
      // 关键：如果断开时还有请求在等回复，说明服务端中途挂了，
      // 那条消息永远不会有回复。必须明确告诉用户，否则就是干等。
      if(pendingRequest){
        stopThinking();
        add('sys', '⚠ 连接中断——这条消息没有收到回复。服务端可能已停止运行，' +
                   '请重新启动 web_server.py 后再试。');
        pendingRequest = false;
      }
      reconnectFails++;
      tip('连接断开，重连中…');
      if(reconnectFails >= 3){
        showOffline();
        setTimeout(connect, 5000);   // 服务已停时放慢重试
      } else {
        setTimeout(connect, 1500);
      }
    };
    ws.onerror = () => tip('连接错误');

    ws.onmessage = async ev => {
      if(ev.data instanceof ArrayBuffer){ playAudio(ev.data); return; }
      let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }

      switch(m.type){
        case 'hello':
        case 'status':
          renderStatus(m.status); break;
        case 'user':
          add('user', m.text); break;
        case 'thinking':
          thinking(); break;
        case 'reply': {
          stopThinking();
          pendingRequest = false;
          const meta = (m.identity ? '识别到：' + m.identity + ' · ' : '') +
                       (m.used_vision ? '已看画面' : '纯文字');
          const bub = addTyping('bot');
          lastReplyBubble = bub;
          await typewrite(bub, m.reply, meta);
          break;
        }
        case 'proactive':
          stopThinking();
          await typewrite(addTyping('bot'), m.text, '（主动关心）');
          break;
        case 'recognize':
          if(m.ok && m.faces && m.faces.length){
            const d = m.faces.map(f => f.name === 'unknown'
              ? '未注册的人' : `${f.name}（相似度 ${f.score}）`).join('、');
            add('sys', '识别结果：' + d);
          } else {
            add('sys', '识别结果：' + (m.reason || '画面中没有人脸'));
          }
          break;
        case 'faces':
          renderPeople(m.people || []);
          toast(m.message || m.reason || '');
          break;
        case 'asr':
          recognizing = false;
          if(m.text){
            $('input').value = m.text;
            sendText();
          } else if(listening){
            // 没识别出内容，继续监听（常开模式下不该提示"再说一次"）
            micUI('listening');
          } else {
            tip('没听清，请再说一次');
          }
          break;
        case 'info': add('sys', m.text); break;
        case 'error': stopThinking(); pendingRequest = false; add('sys', '⚠ ' + m.text); break;
      }
    };
  }

  function send(o){ if(wsReady) ws.send(JSON.stringify(o)); }

  // ================= 音频 =================
  let audioQueue = [], playing = false, audioCtx = null;

  function unlockAudio(){
    if(audioUnlocked) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // 播放一个极短的静音，解锁自动播放权限
      const b = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = b; src.connect(audioCtx.destination); src.start(0);
      audioUnlocked = true;
      $('unlock').className = 'unlock';
      tip('语音已开启');
    }catch(e){ /* 忽略 */ }
  }

  function playAudio(buf){
    const blob = new Blob([buf], {type:'audio/wav'});
    audioQueue.push(URL.createObjectURL(blob));
    if(!audioUnlocked){ $('unlock').className = 'unlock show'; }
    // 播报期间关掉麦克风收集，否则机器人会听到自己的声音并当作新输入
    micMuted = true;
    pump();
  }
  function pump(){
    if(playing || !audioQueue.length) return;
    playing = true;
    const url = audioQueue.shift();
    const a = new Audio(url);
    a.onended = a.onerror = () => {
      URL.revokeObjectURL(url); playing = false;
      // 队列播完才恢复拾音，避免句间空隙把自己的声音录进去
      if(!audioQueue.length){ micMuted = false; resetUtterance(); }
      pump();
    };
    a.play().catch(() => { playing = false; micMuted = false; pump(); });
  }

  // ================= 操作 =================
  function sendText(){
    const ta = $('input');
    const t = ta.value.trim();
    if(!t) return;
    if(!wsReady){ toast('未连接', true); return; }
    if(!audioUnlocked) unlockAudio();
    pendingRequest = true;          // 标记「已发出、等回复」，断线时好提示
    send({type:'chat', text:t, vision:$('chkVision').checked});
    ta.value = ''; ta.style.height = 'auto';
  }

  function doRegister(name){
    const n = (name || $('newName').value || '').trim();
    if(!n){ toast('请先输入名字', true); return; }
    if(!wsReady){ toast('未连接', true); return; }
    tip('拍照注册中…');
    send({type:'register', name:n, from:'camera'});
  }

  function doDeletePerson(name){
    if(!confirm('确定删除「' + name + '」的全部人脸记录和照片？')) return;
    send({type:'face_delete', name:name});
  }

  // ================= 录音（常开监听模式）=================
  // 设计目标（按用户要求）：
  //   点一次开始后**一直录音**，停顿只代表"这句说完了，去识别"，
  //   识别完继续听下一句，不需要再点任何按钮。
  //
  // 两个必须处理的坑：
  //   1) 回声：机器人播报时麦克风会录到自己的声音，会被当成用户在说话。
  //      做法：播报期间暂停收集（micMuted）。
  //   2) 分句：不能把上一句的音频混进下一句。
  //      做法：判定一句结束后**同步**清空缓冲，再异步去识别。
  let listening = false;          // 是否处于常开监听
  let recStream = null, recNode = null, recCtx = null;
  let recBufs = [], recBufSamples = 0;
  let recSpeechMs = 0, recSilenceMs = 0, recTotalMs = 0, recArmed = false;
  let micMuted = false;           // 播报期间暂停收集（防回声）
  let recognizing = false;        // 正在识别上一句

  const REC_SPEECH_RMS    = 0.010;   // 音量超过它算「开始说话」
  const REC_SILENCE_MS    = 1200;    // 停顿多久算「这句结束」
  const REC_MIN_SPEECH_MS = 300;     // 短于它视为噪声，不发送
  const REC_MAX_MS        = 25000;   // 单句最长（防一直说不停）
  const REC_PREBUFFER_MS  = 600;     // 静音时只留最近这么长，作为下一句的开头

  function micUI(state){
    const b = $('btnMic');
    if(!listening){
      b.classList.remove('rec'); b.textContent = '🎤';
      tip('麦克风未开启');
      return;
    }
    b.classList.add('rec'); b.textContent = '⏹';
    if(state === 'speech')           tip('正在听你说…');
    else if(state === 'recognizing') tip('识别中…（仍在听）');
    else tip('持续监听中 · 直接说话，停顿约1秒自动发送');
  }

  async function startListening(){
    if(listening) return;
    try{
      recStream = await navigator.mediaDevices.getUserMedia({
        audio:{ channelCount:1, echoCancellation:true,
                noiseSuppression:true, autoGainControl:true }});
    }catch(e){ toast('无法访问麦克风', true); return; }
    recCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = recCtx.createMediaStreamSource(recStream);
    recNode = recCtx.createScriptProcessor(4096, 1, 1);
    resetUtterance();
    recNode.onaudioprocess = onAudio;
    src.connect(recNode); recNode.connect(recCtx.destination);
    listening = true;
    micUI('listening');
    toast('已开启持续监听，说话即可');
  }

  function stopListening(){
    if(!listening) return;
    listening = false;
    try{ recNode.disconnect(); }catch(e){}
    try{ recStream.getTracks().forEach(t => t.stop()); }catch(e){}
    try{ recCtx.close(); }catch(e){}
    recNode = recCtx = recStream = null;
    resetUtterance();
    micUI();
    toast('已停止监听');
  }

  function resetUtterance(){
    recBufs = []; recBufSamples = 0;
    recSpeechMs = 0; recSilenceMs = 0; recTotalMs = 0; recArmed = false;
  }

  function onAudio(e){
    const buf = e.inputBuffer.getChannelData(0);

    // 播报期间：丢弃录音，避免把机器人自己的声音当成用户说话
    if(micMuted){ resetUtterance(); return; }

    recBufs.push(new Float32Array(buf));
    recBufSamples += buf.length;
    // 还没开始说话时，只保留最近一小段音频（作为下一句的开头）。
    // 不加这个限制的话，长时间无人说话会让 recBufs 无限增长——
    // 每 85ms 一块 4096 样本，一分钟就累积约 11MB，是实打实的内存泄漏。
    if(!recArmed){
      const maxSamples = (REC_PREBUFFER_MS / 1000) * recCtx.sampleRate;
      while(recBufs.length > 1 && recBufSamples > maxSamples){
        recBufSamples -= recBufs[0].length;
        recBufs.shift();
      }
    }

    // 这一块的能量（RMS）
    let sum = 0;
    for(let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const blockMs = (buf.length / recCtx.sampleRate) * 1000;
    recTotalMs += blockMs;

    if(rms > REC_SPEECH_RMS){
      recSpeechMs += blockMs;
      recSilenceMs = 0;
      if(!recArmed && recSpeechMs >= REC_MIN_SPEECH_MS){
        recArmed = true;              // 说够长了，才允许「停顿即结束」
        micUI('speech');
      }
    } else if(recArmed){
      recSilenceMs += blockMs;
      if(recSilenceMs >= REC_SILENCE_MS){ flushUtterance(); return; }
    }

    if(recTotalMs >= REC_MAX_MS) flushUtterance();
  }

  // 把当前这句送出去识别，并**立刻开始收集下一句**（不停止录音）
  function flushUtterance(){
    const bufs = recBufs;
    const speechMs = recSpeechMs;
    resetUtterance();                 // 同步清空，避免下一句混入上一句
    if(speechMs < REC_MIN_SPEECH_MS) return;    // 噪声/误触，丢弃
    recognizing = true;
    micUI('recognizing');
    // 转换与编码放在回调之外做，别阻塞音频线程
    setTimeout(() => sendUtterance(bufs), 0);
  }

  function sendUtterance(bufs){
    if(!bufs.length) return;
    const inRate = recCtx ? recCtx.sampleRate : 48000;
    const len = bufs.reduce((a,b) => a + b.length, 0);
    if(!len){ recognizing = false; micUI('listening'); return; }
    const all = new Float32Array(len);
    let off = 0;
    bufs.forEach(b => { all.set(b, off); off += b.length; });

    // 重采样到 16k（后端 ASR 要求）
    const ratio = inRate / 16000;
    const outLen = Math.floor(all.length / ratio);
    const pcm = new Int16Array(outLen);
    for(let i = 0; i < outLen; i++){
      const v = all[Math.floor(i * ratio)] || 0;
      pcm[i] = Math.max(-32768, Math.min(32767, v * 32767));
    }
    const bytes = new Uint8Array(pcm.buffer);
    let bin = '';
    const CH = 8192;
    for(let i = 0; i < bytes.length; i += CH){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    send({type:'asr_bytes', data: btoa(bin)});
  }

  // ================= 头像 =================
  $('botAvatar').onclick = () => $('avatarFile').click();
  $('avatarFile').onchange = async e => {
    const f = e.target.files[0];
    if(!f) return;
    if(f.size > 5 * 1024 * 1024){ toast('图片太大（上限 5MB）', true); return; }
    const fd = new FormData();
    fd.append('file', f);
    try{
      const r = await fetch('/api/avatar', {method:'POST', body:fd});
      const j = await r.json();
      if(j.ok){
        AVATAR_HTML = '<img src="' + j.url + '" alt="">';
        $('botAvatar').innerHTML = AVATAR_HTML;
        toast(j.message || '头像已更新');
      } else { toast(j.reason || '上传失败', true); }
    }catch(err){ toast('上传失败: ' + err.message, true); }
    e.target.value = '';
  };

  // ================= 事件绑定 =================
  // 侧栏卡片折叠：点标题展开/收起，状态记入 localStorage，刷新后保持。
  // 标题里的按钮（刷新/清空）不触发折叠。
  document.querySelectorAll('.card').forEach(card => {
    const head = card.querySelector('.card-head');
    if(!head) return;
    const key = 'dsh.card.collapsed.' + (card.dataset.card || head.textContent.trim());
    head.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', e => e.stopPropagation());
    });
    try{
      if(localStorage.getItem(key) === '1') card.classList.add('collapsed');
    }catch(e){}
    head.addEventListener('click', () => {
      card.classList.toggle('collapsed');
      try{
        localStorage.setItem(key, card.classList.contains('collapsed') ? '1' : '0');
      }catch(e){}
    });
  });

  $('btnSend').onclick = sendText;
  $('input').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
  });
  $('input').addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 130) + 'px';
  });
  $('btnMic').onclick = () => listening ? stopListening() : startListening();
  $('btnLoad').onclick = () => { unlockAudio(); send({type:'load'}); tip('开始加载模型…'); };
  $('btnRecognize').onclick = () => { send({type:'recognize'}); tip('识别中…'); };
  $('btnRefresh').onclick = () => send({type:'status'});
  $('btnClearChat').onclick = () => { msgs.innerHTML = ''; add('sys','对话已清空'); };

  // 释放摄像头与显存（保留网页服务）
  $('btnUnload').onclick = async () => {
    if(!confirm('释放摄像头和显存？释放后需要重新点「启动系统」才能再用。')) return;
    tip('正在释放…');
    try{
      const r = await fetch('/api/unload', {method:'POST'});
      const j = await r.json();
      toast(j.message || '已释放');
      send({type:'status'});
    }catch(e){ toast('释放失败: ' + e.message, true); }
  };

  // 完全关闭服务
  $('btnShutdown').onclick = async () => {
    if(!confirm('关闭服务？\n\n会释放摄像头、显存并退出后台进程。\n' +
                '之后需要重新运行 web_server.py 才能再打开网页。')) return;
    tip('正在关闭服务…');
    try{
      const r = await fetch('/api/shutdown', {method:'POST'});
      const j = await r.json();
      toast(j.message || '服务正在关闭');
    }catch(e){ /* 服务关停时连接可能被掐断，属正常 */ }
    setTimeout(() => {
      document.body.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;' +
        'height:100vh;flex-direction:column;gap:14px;color:#8b98a5;' +
        'font-family:Microsoft YaHei,sans-serif">' +
        '<div style="font-size:42px">🌙</div>' +
        '<div style="font-size:15px">服务已关闭，摄像头和显存已释放</div>' +
        '<div style="font-size:12.5px">需要时重新运行 web_server.py 即可</div></div>';
    }, 1200);
  };
  $('btnRegister').onclick = () => doRegister();
  $('newName').addEventListener('keydown', e => {
    if(e.key === 'Enter') doRegister();
  });
  $('btnClearFaces').onclick = () => {
    if(confirm('确定清空整个人脸库？所有人脸记录和照片都会被删除。'))
      send({type:'faces_clear'});
  };
  $('unlock').onclick = unlockAudio;

  // 任意点击都尝试解锁音频（浏览器的自动播放限制）
  // 首次交互时：解锁音频 + 自动开启持续监听
  // 说明：浏览器出于安全限制，必须由用户手势才能访问麦克风，
  // 所以做不到「打开页面就录」，但可以做到「点一下之后一直录」。
  const unlockOnce = () => {
    unlockAudio();
    if(!listening) startListening();
  };
  document.addEventListener('click', unlockOnce, {once:true});
  document.addEventListener('keydown', unlockOnce, {once:true});

  setInterval(() => send({type:'status'}), 5000);
  connect();
})();
</script>
</body>
</html>
